---
# Source: aws-monitor/templates/networkPolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-monitor-np
  namespace: dev
  labels:
    generator: helm
    name: aws-monitor
spec:
  podSelector:
    matchLabels:
      app: aws-monitor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5001
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow outbound HTTP and HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # MongoDB Atlas driver connections use TCP 27017.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 27017
---
# Source: aws-monitor/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aws-monitor-pdb
  namespace: dev
spec:
  maxUnavailable: 25%
  selector:
    matchLabels:
      app: aws-monitor
---
# Source: aws-monitor/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: aws-monitor-svc
  namespace: dev
  labels:
    app: aws-monitor
    generator: helm
    name: aws-monitor
spec:
  selector:
    app: aws-monitor
    generator: helm
    name: aws-monitor
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
---
# Source: aws-monitor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-monitor-deploy
  namespace: dev
  annotations:
    checkov.io/skip1: "CKV_K8S_35=Runtime environment credentials from Kubernetes Secret references are an intentional application requirement."
  labels:
    generator: helm
    name: aws-monitor
spec:
  selector:
    matchLabels:
      app: aws-monitor
      generator: helm
      name: aws-monitor
  replicas: 2
  template:
    metadata:
      labels:
        app: aws-monitor
        generator: helm
        name: aws-monitor
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: aws-monitor
                topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aws-monitor
          image: "sm1986/aws-monitor@sha256:96028efa614aab7f66bbfed1b81a1509ab2f738579af3790709cca6a3d8c0019"
          imagePullPolicy: Always

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20

          securityContext:
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5001

          env:
            - name: AUTH_TRUSTED_PROXY_CIDRS
              value: ""
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: aws-monitor-mongodb
                  key: MONGODB_URI
            - name: MONGODB_DATABASE
              value: "aws_monitor"
            - name: AUTH_MAX_FAILURES
              value: "5"
            - name: AUTH_WINDOW_SECONDS
              value: "60"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "5001"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_CACHE_TTL
              value: "30"
            - name: AWS_REFRESH_TIMEOUT
              value: "3"
            - name: AWS_FAILURE_COOLDOWN
              value: "10"
            - name: AWS_TASK_TIMEOUT
              value: "15"
            - name: AWS_MAX_DATA_AGE
              value: "900"
            - name: WEB_CONCURRENCY
              value: "2"
            - name: GUNICORN_THREADS
              value: "4"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-monitor-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-monitor-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aws-monitor-secret
                  key: AWS_SESSION_TOKEN
                  optional: true

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "100Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
---
# Source: aws-monitor/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-monitor-ing
  namespace: dev
  labels:
    generator: helm
    name: aws-monitor
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: "nginx"
  rules:
    - host: "localhost"
      http:
        paths:
          - path: "^/dev(/q(/.*)?)?$"
            pathType: Prefix
            backend:
              service:
                name: aws-monitor-svc
                port:
                  number: 80
---
# Source: aws-monitor/templates/podMonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: aws-monitor-dev-pm
  namespace: "monitoring"
  labels:
    release: "prometheus"
    generator: helm
    name: aws-monitor
spec:
  selector:
    matchLabels:
      app: aws-monitor

  namespaceSelector:
    matchNames:
      - "dev"

  podMetricsEndpoints:
    - port: http
      path: "/metrics"
      interval: "15s"
      scrapeTimeout: "10s"
